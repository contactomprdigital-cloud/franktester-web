[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Un asset inexistente (p. ej. un chunk viejo tras un deploy) debe dar un 404
# real y no el index.html del SPA. Las reglas se leen de arriba abajo y gana la
# primera que coincide, por eso esta va antes del catch-all. Sin force, un
# archivo que sí existe se sirve antes que cualquier regla: los assets reales
# no se ven afectados.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=(), browsing-topics=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    # CSP en modo Report-Only: solo informa en la consola, no bloquea nada.
    # Tras validarla en el deploy preview sin violaciones, renombrar esta clave
    # a Content-Security-Policy (mismo valor) para que se aplique de verdad.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://xqjzlypifyftdgaophvh.supabase.co; connect-src 'self' https://xqjzlypifyftdgaophvh.supabase.co wss://xqjzlypifyftdgaophvh.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; frame-ancestors 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El panel no se indexa ni se guarda en caché. robots.txt no lo menciona a
# propósito: el rastreador tiene que poder leer este noindex. /admin/* no cubre
# /admin sin barra final, por eso van las dos reglas.
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
